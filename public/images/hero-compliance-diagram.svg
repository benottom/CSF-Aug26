<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of compliance domains connected around a central security core">
  <!-- background grid, matching the site's technical-paper motif -->
  <g stroke="#e2dac5" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="0" y1="360" x2="600" y2="360" />
    <line x1="0" y1="440" x2="600" y2="440" />
    <line x1="60" y1="0" x2="60" y2="480" />
    <line x1="180" y1="0" x2="180" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="420" y1="0" x2="420" y2="480" />
    <line x1="540" y1="0" x2="540" y2="480" />
  </g>

  <!-- connecting lines from core to satellite nodes -->
  <g stroke="#9ebbe3" stroke-width="1.5">
    <line x1="300" y1="240" x2="300" y2="120" />
    <line x1="300" y1="240" x2="180" y2="180" />
    <line x1="300" y1="240" x2="420" y2="180" />
    <line x1="300" y1="240" x2="180" y2="320" />
    <line x1="300" y1="240" x2="420" y2="320" />
    <line x1="300" y1="240" x2="300" y2="380" />
  </g>

  <!-- node dots at line endpoints -->
  <g fill="#003580">
    <circle cx="300" cy="120" r="3" />
    <circle cx="180" cy="180" r="3" />
    <circle cx="420" cy="180" r="3" />
    <circle cx="180" cy="320" r="3" />
    <circle cx="420" cy="320" r="3" />
    <circle cx="300" cy="380" r="3" />
  </g>

  <!-- central core: shield -->
  <g transform="translate(300,240)">
    <circle r="46" fill="#f4f1ea" stroke="#003580" stroke-width="2" />
    <path d="M0 -20 L16 -13 V2 C16 14 9 21 0 25 C-9 21 -16 14 -16 2 V-13 Z"
          fill="none" stroke="#003580" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M-6 2 L-1.5 7 L8 -5" fill="none" stroke="#2E6FBA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- satellite: Governance (document) -->
  <g transform="translate(300,120)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <path d="M-9 -12 H5 L10 -7 V12 H-9 Z" fill="none" stroke="#131c2e" stroke-width="1.4" stroke-linejoin="round" />
    <line x1="-5" y1="-2" x2="6" y2="-2" stroke="#131c2e" stroke-width="1.2" />
    <line x1="-5" y1="3" x2="6" y2="3" stroke="#131c2e" stroke-width="1.2" />
    <line x1="-5" y1="8" x2="2" y2="8" stroke="#131c2e" stroke-width="1.2" />
  </g>
  <text x="300" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">GOVERNANCE</text>

  <!-- satellite: Risk (bar chart) -->
  <g transform="translate(180,180)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <line x1="-10" y1="10" x2="10" y2="10" stroke="#131c2e" stroke-width="1.4" />
    <rect x="-8" y="-2" width="5" height="12" fill="none" stroke="#131c2e" stroke-width="1.3" />
    <rect x="-1.5" y="-8" width="5" height="18" fill="none" stroke="#131c2e" stroke-width="1.3" />
    <rect x="5" y="-11" width="5" height="21" fill="none" stroke="#131c2e" stroke-width="1.3" />
  </g>
  <text x="132" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">RISK</text>

  <!-- satellite: Assurance (checkmark badge) -->
  <g transform="translate(420,180)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <circle r="13" fill="none" stroke="#131c2e" stroke-width="1.4" />
    <path d="M-6 0 L-2 5 L7 -6" fill="none" stroke="#131c2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="468" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">ASSURANCE</text>

  <!-- satellite: Regulatory (scale) -->
  <g transform="translate(180,320)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#131c2e" stroke-width="1.3" />
    <line x1="-11" y1="-7" x2="11" y2="-7" stroke="#131c2e" stroke-width="1.3" />
    <path d="M-11 -7 L-16 2 L-6 2 Z" fill="none" stroke="#131c2e" stroke-width="1.1" stroke-linejoin="round" />
    <path d="M11 -7 L6 2 L16 2 Z" fill="none" stroke="#131c2e" stroke-width="1.1" stroke-linejoin="round" />
    <line x1="-6" y1="11" x2="6" y2="11" stroke="#131c2e" stroke-width="1.3" />
  </g>
  <text x="132" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">REGULATORY</text>

  <!-- satellite: Incident response (bolt) -->
  <g transform="translate(420,320)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <path d="M2 -12 L-8 3 H0 L-2 12 L9 -3 H1 Z" fill="none" stroke="#131c2e" stroke-width="1.3" stroke-linejoin="round" />
  </g>
  <text x="468" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">RESPONSE</text>

  <!-- satellite: Audit (magnifier) -->
  <g transform="translate(300,380)">
    <circle r="30" fill="#f4f1ea" stroke="#2E6FBA" stroke-width="1.6" />
    <circle cx="-3" cy="-3" r="8" fill="none" stroke="#131c2e" stroke-width="1.4" />
    <line x1="3" y1="3" x2="10" y2="10" stroke="#131c2e" stroke-width="1.6" stroke-linecap="round" />
  </g>
  <text x="300" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#131c2e" letter-spacing="0.04em">AUDIT</text>

</svg>
